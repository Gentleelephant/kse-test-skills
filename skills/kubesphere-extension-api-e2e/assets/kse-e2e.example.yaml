schemaVersion: 1
name: extension-api-e2e

target:
  # KubeSphere ks-apiserver, not Console or the extension backend Service.
  ksAPIServer: http://127.0.0.1:30880
  cluster: host
  tls:
    insecureSkipVerify: false

auth:
  # auto prefers adminToken, otherwise username/password.
  mode: auto
  adminUsername: admin
  adminPassword: ""
  adminToken: ""
  loginPath: /oauth/token
  oauthClientID: kubesphere
  oauthClientSecret: kubesphere

sources:
  apiDocs:
    - path: ./apidocs.json
      format: auto
  extension:
    path: .
    renderer: auto
    valuesFiles: []
    releaseName: extension-api-e2e
    namespace: extension-system
    kubeVersion: ""

discovery:
  extensionName: ""
  roleTemplateSelector: {}

# Only add entries when an API operation cannot be mapped reliably from its
# documented path and operationId to RoleTemplate attributes.
apiMappings: {}
# Example:
# apiMappings:
#   GetSchedulingPolicy:
#     apiGroup: scheduling.volcano.sh
#     version: v1beta1
#     resource: scheduling-policy
#     verb: get
#     scope: cluster

roles:
  mode: auto
  include:
    - authenticated
    - cluster-admin
    - cluster-viewer
    - workspace-admin
    - workspace-viewer
    - namespace-admin
    - namespace-operator
    - namespace-viewer
    - no-permission
    - no-token

execution:
  resourcePrefix: extension-e2e
  timeout: 10m
  roleAggregationWait: 30s
  membershipWait: 30s
  cleanup: always
  # The runner always creates two Workspaces. Workspace A has two Namespaces;
  # Workspace B has one. This distinguishes own, sibling, and cross-Workspace access.

report:
  directory: ./test-results
  plan: kse-e2e-plan.json
  json: kse-e2e-report.json
  markdown: kse-e2e-report.md
