schemaVersion: 1
name: extension-api-e2e

target:
  # KubeSphere ks-apiserver, not Console or the extension backend Service.
  ksAPIServer: http://127.0.0.1:30880
  cluster: host
  tls:
    insecureSkipVerify: false

auth:
  # auto prefers adminToken, otherwise username/password.
  mode: auto
  adminUsername: admin
  adminPassword: ""
  adminToken: ""
  loginPath: /oauth/token
  oauthClientID: kubesphere
  oauthClientSecret: kubesphere

sources:
  apiDocs:
    - path: ./apidocs.json
      format: auto
  extension:
    path: .
    renderer: auto
    valuesFiles: []
    releaseName: extension-api-e2e
    namespace: extension-system
    kubeVersion: ""
  # The Agent reads these trees to derive routes, SAR attributes, business
  # validation, resource dependencies, filtering, and error contracts.
  backendCode:
    - name: extension-backend
      path: .
      language: auto
      include:
        - ./cmd
        - ./pkg
        - ./internal
      exclude:
        - ./vendor
        - ./node_modules
        - ./test-results
        - ./dist
        - ./build

discovery:
  extensionName: ""
  roleTemplateSelector: {}

routing:
  mode: auto
  pathOverrides: {}

roles:
  mode: auto
  include:
    - authenticated
    - cluster-admin
    - cluster-viewer
    - workspace-admin
    - workspace-viewer
    - namespace-admin
    - namespace-operator
    - namespace-viewer
    - no-permission
    - no-token

scenarios:
  # Values unavailable from API documents, charts, source, or runtime
  # discovery belong here. This remains the only user-maintained file.
  variables: {}
  overrides: []
  additional: []

execution:
  resourcePrefix: extension-e2e
  timeout: 10m
  roleAggregationWait: 30s
  cleanup: always
  tenants:
    workspaces: 2
    namespacesPerWorkspace: 1

report:
  directory: ./test-results
  plan: kse-e2e-plan.json
  json: kse-e2e-report.json
  markdown: kse-e2e-report.md
